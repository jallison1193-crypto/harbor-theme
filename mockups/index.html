<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Theme Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..700&family=Instrument+Serif:ital@0;1&family=Sora:wght@300..700&display=swap" rel="stylesheet">
<style>
/* Registered so ambient colors interpolate smoothly instead of jumping. */
@property --amb1 { syntax: "<color>"; inherits: true; initial-value: #f2b880; }
@property --amb2 { syntax: "<color>"; inherits: true; initial-value: #1f6f8b; }
@property --amb3 { syntax: "<color>"; inherits: true; initial-value: #0b2a3c; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; }
button { font: inherit; color: inherit; }

/* ---------- concept switcher (not part of the theme) ---------- */
#switcher {
  position: fixed; inset: 0 0 auto 0; height: 46px; z-index: 1000;
  display: flex; align-items: center; gap: 6px; padding: 0 14px;
  background: #0a0c10; border-bottom: 1px solid #1c2028;
  font: 500 13px "Geist", system-ui, sans-serif; color: #c9ced8;
}
#switcher .label { color: #6b7280; margin-right: 10px; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
#switcher button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: #9aa3b2; }
#switcher button[aria-pressed="true"] { background: #1a1e27; color: #fff; }
#switcher button:hover { color: #fff; }
#switcher .num { opacity: .5; margin-right: 6px; font-variant-numeric: tabular-nums; }
#switcher .spacer { flex: 1; }
#switcher .note { color: #5b6270; font-size: 12px; }

/* ---------- app shell ---------- */
#app {
  --blur: 24px; --rim: .35; --tint: .06; --sat: 170%;
  --accent: #7cc4ff;
  --glow: .75; --spill: 1; --amb-speed: 1200ms; --fixed: #ff7a59;
  --depth: 1; --tilt: 10;
  --pw: 150px;
  --px: 0; --py: 0; --cx: 50%; --cy: 50%;
  position: fixed; inset: 46px 0 0 0; overflow: hidden;
  font-family: "Geist", system-ui, sans-serif; color: #eef2f7;
  transition: --amb1 var(--amb-speed) ease, --amb2 var(--amb-speed) ease, --amb3 var(--amb-speed) ease;
}
#wall { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
#main {
  position: absolute; inset: 0; z-index: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
}
#main::-webkit-scrollbar { display: none; }
.chrome { position: absolute; z-index: 6; display: none; }
#panel { z-index: 10; }
#light { position: absolute; inset: 0; z-index: 4; pointer-events: none; display: none; }

/* ---------- shared content ---------- */
.hero { position: relative; overflow: hidden; }
.hero-art { position: absolute; inset: 0; }
.L { position: absolute; inset: -5%; transition: opacity .6s ease; }
.L svg { width: 100%; height: 100%; display: block; }
.hero-fade { position: absolute; inset: 0; pointer-events: none; }
.hero-copy { position: relative; z-index: 2; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; display: flex; align-items: center; gap: 8px; }
.eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
.hero h1 { margin: 10px 0 12px; font-weight: 400; line-height: .95; }
.meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; opacity: .85; }
.meta .chip { padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; }
.hero p.desc { max-width: 46ch; line-height: 1.55; opacity: .82; margin: 14px 0 22px; font-size: 15px; }
.actions { display: flex; gap: 10px; }
.btn { border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.btn svg { width: 16px; height: 16px; }
.dots { position: absolute; z-index: 3; display: flex; gap: 6px; }
.dots button { width: 22px; height: 4px; border-radius: 4px; border: 0; padding: 0; background: rgb(255 255 255 / .28); cursor: pointer; transition: width .3s, background .3s; }
.dots button[aria-current="true"] { width: 40px; background: #fff; }

.row { margin-top: 26px; transition: opacity .35s ease, transform .5s cubic-bezier(.16,1,.3,1); }
.row header { display: flex; align-items: baseline; justify-content: space-between; padding: 0 var(--pad, 48px); }
.row h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.row header a { font-size: 13px; opacity: .55; cursor: pointer; }
.track { display: flex; gap: 16px; overflow-x: auto; padding: 14px var(--pad, 48px) 22px; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }

.card { position: relative; flex: none; cursor: pointer; border-radius: 14px; overflow: hidden; background: #111; transform-style: preserve-3d;
  transition: transform .45s cubic-bezier(.16,1,.3,1), box-shadow .45s ease; }
.card.poster { width: var(--pw); aspect-ratio: 2 / 3; }
.card.wide { width: calc(var(--pw) * 1.9); aspect-ratio: 16 / 9; }
.card .art { position: absolute; inset: 0; }
.card .art svg { width: 100%; height: 100%; display: block; }
.card .cap { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px; background: linear-gradient(transparent, rgb(0 0 0 / .78)); }
.card .cap b { display: block; font-size: 14px; line-height: 1.15; }
.card .cap span { font-size: 11px; opacity: .7; }
.card .prog { position: absolute; left: 12px; right: 12px; bottom: 9px; height: 3px; border-radius: 3px; background: rgb(255 255 255 / .22); }
.card .prog i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.card.wide .cap { padding-bottom: 20px; }
.card .sheen { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgb(255 255 255 / .28), transparent 55%); mix-blend-mode: soft-light; }

/* ---------- panel (shared structure) ---------- */
#panel {
  position: absolute; width: 330px; max-height: calc(100% - 36px); overflow: auto; scrollbar-width: none;
  border-radius: 22px; padding: 18px 18px 20px; font-size: 13px;
  transition: opacity .35s ease, transform .45s cubic-bezier(.16,1,.3,1);
}
#panel::-webkit-scrollbar { display: none; }
#app[data-panel="closed"] #panel { opacity: 0; pointer-events: none; transform: translateX(24px) scale(.98); }
#panel .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#panel .ph b { font-size: 15px; }
#panel .ph small { display: block; opacity: .55; font-size: 12px; margin-top: 2px; }
#panel .x { border: 0; background: rgb(255 255 255 / .08); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
#panel h3 { margin: 18px 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .5; font-weight: 600; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { border: 0; cursor: pointer; padding: 7px 12px; border-radius: 999px; background: rgb(255 255 255 / .07); font-size: 12px; }
.presets button:hover { background: rgb(255 255 255 / .14); }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin: 10px 0; }
.ctl span { opacity: .85; }
.ctl output { font-variant-numeric: tabular-nums; opacity: .55; font-size: 12px; }
.ctl input[type=range] { grid-column: 1 / -1; width: 100%; appearance: none; height: 4px; border-radius: 4px; background: rgb(255 255 255 / .14); outline: none; }
.ctl input[type=range]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgb(0 0 0 / .45); cursor: pointer; }
.tog { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 0; background: none; padding: 7px 0; cursor: pointer; text-align: left; }
.tog i { width: 36px; height: 22px; border-radius: 22px; background: rgb(255 255 255 / .16); position: relative; transition: background .25s; flex: none; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.16,1,.3,1); }
.tog[aria-pressed="true"] i { background: var(--accent); }
.tog[aria-pressed="true"] i::after { transform: translateX(14px); }
.tog small { display: block; opacity: .5; font-size: 11px; margin-top: 2px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 12px; background: rgb(0 0 0 / .28); }
.seg button { border: 0; background: none; padding: 7px 4px; border-radius: 9px; cursor: pointer; font-size: 12px; opacity: .7; }
.seg button[aria-pressed="true"] { background: rgb(255 255 255 / .14); opacity: 1; box-shadow: inset 0 1px 0 rgb(255 255 255 / .18); }
.sw { display: flex; gap: 8px; flex-wrap: wrap; }
.sw button { width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .2); }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px rgb(0 0 0 / .6), 0 0 0 4px #fff; }
.fps { margin-top: 10px; font-size: 11px; opacity: .5; }
#app:not([data-dir="deepwater"]) [data-for="deepwater"],
#app:not([data-dir="ambilight"]) [data-for="ambilight"],
#app:not([data-dir="spatial"]):not([data-fx="spatial"]) [data-for="spatial"] { display: none !important; }

/* =====================================================================
   1. DEEPWATER GLASS
   ===================================================================== */
[data-dir="deepwater"] #wall { background: #05080e; }
[data-dir="deepwater"] .blob { position: absolute; border-radius: 50%; width: 70vmax; height: 70vmax; will-change: transform; }
[data-dir="deepwater"] .b1 { left: -20vmax; top: -30vmax; background: radial-gradient(closest-side, rgb(18 84 128 / .55), transparent); animation: drift1 34s ease-in-out infinite alternate; }
[data-dir="deepwater"] .b2 { right: -25vmax; top: 10vmax; background: radial-gradient(closest-side, rgb(30 46 120 / .5), transparent); animation: drift2 41s ease-in-out infinite alternate; }
[data-dir="deepwater"] .b3 { left: 20vmax; bottom: -40vmax; background: radial-gradient(closest-side, rgb(12 110 120 / .35), transparent); animation: drift3 47s ease-in-out infinite alternate; }
[data-dir="deepwater"] .rays { position: absolute; inset: -20%; opacity: .5;
  background: repeating-linear-gradient(105deg, transparent 0 60px, rgb(140 200 255 / .035) 60px 64px, transparent 64px 140px);
  -webkit-mask: radial-gradient(60% 50% at 40% 20%, #000, transparent); mask: radial-gradient(60% 50% at 40% 20%, #000, transparent);
  animation: rays 26s linear infinite; }
[data-dir="deepwater"][data-caustics="off"] .blob,
[data-dir="deepwater"][data-caustics="off"] .rays,
[data-dir="deepwater"][data-perf="balanced"] .rays,
[data-dir="deepwater"][data-perf="lite"] .rays { animation: none; }
[data-dir="deepwater"][data-caustics="off"] .rays { display: none; }
@keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.1); } }
@keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(.92); } }
@keyframes drift3 { to { transform: translate(-12vmax, -14vmax) scale(1.15); } }
@keyframes rays { to { transform: translateX(140px); } }
.grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* the glass recipe */
[data-dir="deepwater"] .glass {
  background:
    linear-gradient(180deg, rgb(255 255 255 / calc(var(--tint) + .05)), rgb(255 255 255 / var(--tint))),
    color-mix(in oklab, var(--glass-tint, #0b1220) 40%, transparent);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / var(--rim)),
    inset 0 -1px 0 rgb(255 255 255 / calc(var(--rim) * .25)),
    0 30px 60px -24px rgb(0 0 0 / .75),
    0 2px 6px rgb(0 0 0 / .25);
}
[data-dir="deepwater"] .glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(140deg, rgb(255 255 255 / calc(var(--rim) * 1.3)) 0%, rgb(255 255 255 / .04) 30%, transparent 55%, rgb(255 255 255 / calc(var(--rim) * .6)) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
[data-dir="deepwater"] .glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 60% at 20% -10%, rgb(255 255 255 / calc(var(--rim) * .35)), transparent 60%);
}
[data-dir="deepwater"][data-arttint="on"] { --glass-tint: color-mix(in oklab, var(--amb2) 70%, #000); }
[data-dir="deepwater"][data-perf="balanced"] .glass { -webkit-backdrop-filter: blur(calc(var(--blur) * .5)) saturate(140%); backdrop-filter: blur(calc(var(--blur) * .5)) saturate(140%); }
[data-dir="deepwater"][data-perf="lite"] .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgb(20 27 40 / .94); }

/* menubar */
[data-dir="deepwater"] #menubar { display: flex; inset: 0 0 auto 0; height: 34px; align-items: center; gap: 22px; padding: 0 18px; font-size: 13px; border-radius: 0; }
[data-dir="deepwater"][data-chrome="island"] #menubar { display: none; }
#menubar .logo { font-weight: 700; display: flex; align-items: center; gap: 7px; }
#menubar .logo svg { width: 16px; height: 16px; }
#menubar a { opacity: .72; cursor: pointer; }
#menubar a.on { opacity: 1; }
#menubar .right { margin-left: auto; display: flex; gap: 16px; align-items: center; opacity: .85; font-variant-numeric: tabular-nums; }
#menubar .right svg { width: 15px; height: 15px; }

/* dock */
[data-dir="deepwater"][data-chrome="dock"] #dock { display: flex; }
#dock { left: 50%; bottom: 14px; transform: translateX(-50%); align-items: flex-end; gap: 8px; padding: 8px 10px; border-radius: 24px; height: 66px; }
#dock .di { --s: 1; position: relative; width: calc(48px * var(--s)); height: calc(48px * var(--s)); flex: none; border: 0; padding: 0; cursor: pointer;
  border-radius: calc(14px * var(--s)); display: grid; place-items: center; transition: width .18s ease, height .18s ease;
  background: linear-gradient(160deg, rgb(255 255 255 / .2), rgb(255 255 255 / .04)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .3), 0 6px 14px -6px rgb(0 0 0 / .6); }
#dock .di svg { width: 46%; height: 46%; }
#dock .di.on { background: linear-gradient(160deg, color-mix(in oklab, var(--accent) 75%, #fff 10%), color-mix(in oklab, var(--accent) 45%, #000)); color: #04101c; }
#dock .di.on::after { content: ""; position: absolute; bottom: -7px; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: .85; }
#dock .di .tip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(4px); opacity: 0; pointer-events: none;
  white-space: nowrap; font-size: 12px; padding: 4px 10px; border-radius: 8px; background: rgb(20 26 38 / .9); color: #fff; transition: opacity .15s, transform .15s; }
#dock .di:hover .tip { opacity: 1; transform: translateX(-50%); }
#dock .sep { width: 1px; align-self: stretch; margin: 6px 2px; background: rgb(255 255 255 / .16); }

/* sidebar */
[data-dir="deepwater"][data-chrome="sidebar"] #sidebar { display: flex; }
#sidebar { left: 14px; top: 48px; bottom: 14px; width: 210px; flex-direction: column; gap: 2px; padding: 14px 10px; border-radius: 22px; }
#sidebar .si { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 0; background: none; cursor: pointer; font-size: 14px; opacity: .75; text-align: left; }
#sidebar .si svg { width: 18px; height: 18px; }
#sidebar .si:hover { background: rgb(255 255 255 / .06); opacity: 1; }
#sidebar .si.on { background: rgb(255 255 255 / .1); opacity: 1; box-shadow: inset 0 1px 0 rgb(255 255 255 / .14); }
#sidebar .si.on svg { color: var(--accent); }
#sidebar .grow { flex: 1; }
#sidebar .cap { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .4; padding: 4px 12px 8px; }

/* island */
[data-dir="deepwater"][data-chrome="island"] #island { display: flex; }
#island { top: 14px; left: 50%; transform: translateX(-50%); align-items: center; gap: 4px; padding: 6px; border-radius: 999px; }
#island .ii { border: 0; background: none; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; opacity: .72; display: flex; align-items: center; gap: 8px; }
#island .ii svg { width: 15px; height: 15px; }
#island .ii.on { background: rgb(255 255 255 / .14); opacity: 1; box-shadow: inset 0 1px 0 rgb(255 255 255 / .22); }
#island .clock { padding: 0 12px 0 8px; font-size: 13px; opacity: .8; font-variant-numeric: tabular-nums; }

/* deepwater content */
[data-dir="deepwater"] #main { --pad: 40px; padding: 50px 0 110px; }
[data-dir="deepwater"][data-chrome="sidebar"] #main { padding-left: 224px; padding-bottom: 30px; }
[data-dir="deepwater"][data-chrome="island"] #main { padding-top: 76px; padding-bottom: 30px; }
[data-dir="deepwater"] .hero { margin: 0 40px; height: min(58vh, 560px); border-radius: 28px; box-shadow: 0 40px 80px -40px rgb(0 0 0 / .9), inset 0 0 0 1px rgb(255 255 255 / .08); }
[data-dir="deepwater"] .hero-fade { background: linear-gradient(90deg, rgb(3 6 12 / .55), transparent 55%), linear-gradient(0deg, rgb(3 6 12 / .5), transparent 40%); }
[data-dir="deepwater"] .hero-copy { position: absolute; left: 28px; bottom: 28px; width: min(470px, 60%); padding: 24px 26px; border-radius: 24px; }
[data-dir="deepwater"] .hero h1 { font-family: "Instrument Serif", serif; font-size: clamp(44px, 5vw, 72px); letter-spacing: -.01em; }
[data-dir="deepwater"] .hero p.desc { margin: 10px 0 18px; font-size: 14px; }
[data-dir="deepwater"] .meta .chip { background: rgb(255 255 255 / .14); }
[data-dir="deepwater"] .btn.primary { background: #fff; color: #050a12; }
[data-dir="deepwater"] .btn.ghost { background: rgb(255 255 255 / .12); box-shadow: inset 0 1px 0 rgb(255 255 255 / .2); }
[data-dir="deepwater"] .dots { right: 28px; bottom: 28px; }
[data-dir="deepwater"] .card { box-shadow: 0 18px 30px -18px rgb(0 0 0 / .8), inset 0 0 0 1px rgb(255 255 255 / .06); }
[data-dir="deepwater"] .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 1px 0 rgb(255 255 255 / .22), inset 0 0 0 1px rgb(255 255 255 / .08); }
[data-dir="deepwater"] .card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 28px 40px -20px rgb(0 0 0 / .9), 0 0 0 1px rgb(255 255 255 / .18); }
[data-dir="deepwater"] #panel { right: 18px; top: 48px; }
[data-dir="deepwater"][data-chrome="island"] #panel { top: 18px; }

/* =====================================================================
   2. AMBILIGHT
   ===================================================================== */
[data-dir="ambilight"] { --a1: var(--amb1); --a2: var(--amb2); --a3: var(--amb3); }
[data-dir="ambilight"][data-follow="off"] { --a1: var(--fixed); --a2: color-mix(in oklab, var(--fixed) 50%, #000); --a3: #0a0a0c; }
[data-dir="ambilight"] #wall { background: color-mix(in oklab, var(--a3) calc(var(--spill) * 45%), #07070a); }
[data-dir="ambilight"] .wash { position: absolute; inset: 0; transition: opacity .6s;
  background:
    radial-gradient(70% 60% at 75% 10%, color-mix(in oklab, var(--a1) calc(var(--glow) * 55%), transparent), transparent 70%),
    radial-gradient(60% 70% at 10% 60%, color-mix(in oklab, var(--a2) calc(var(--glow) * 60%), transparent), transparent 70%),
    radial-gradient(80% 50% at 50% 110%, color-mix(in oklab, var(--a1) calc(var(--glow) * 30%), transparent), transparent 70%);
  opacity: var(--spill); }
[data-dir="ambilight"] .glass {
  background: color-mix(in oklab, var(--a3) 55%, rgb(10 10 14 / .55));
  -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--a1) 22%, transparent), 0 30px 60px -30px rgb(0 0 0 / .8);
}
[data-dir="ambilight"] #ambnav { display: flex; top: 16px; left: 24px; right: 24px; align-items: center; gap: 4px; pointer-events: none; }
#ambnav > * { pointer-events: auto; }
#ambnav .brand { font: 800 20px "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; margin-right: 18px; display: flex; gap: 8px; align-items: center; }
#ambnav .brand svg { width: 20px; height: 20px; color: var(--a1); }
#ambnav .pill { display: flex; gap: 2px; padding: 5px; border-radius: 999px; }
#ambnav .ai { border: 0; background: none; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; opacity: .7; }
#ambnav .ai.on { opacity: 1; background: color-mix(in oklab, var(--a1) 28%, transparent); }
#ambnav .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
#ambnav .ib { width: 38px; height: 38px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
#ambnav .ib svg { width: 17px; height: 17px; }
#ambnav .lit { font-size: 12px; padding: 8px 14px; border-radius: 999px; display: flex; gap: 8px; align-items: center; }
#ambnav .lit i { width: 10px; height: 10px; border-radius: 50%; background: var(--a1); box-shadow: 0 0 12px var(--a1); }
[data-dir="ambilight"] #main { --pad: 48px; padding: 0 0 40px; }
[data-dir="ambilight"] .hero { height: min(78vh, 720px); }
[data-dir="ambilight"] .hero-art { -webkit-mask: linear-gradient(180deg, #000 55%, transparent); mask: linear-gradient(180deg, #000 55%, transparent); }
[data-dir="ambilight"] .hero-art .L { inset: -5% -5% -5% 20%; -webkit-mask: linear-gradient(90deg, transparent, #000 35%); mask: linear-gradient(90deg, transparent, #000 35%); }
[data-dir="ambilight"] .hero-fade { background: linear-gradient(90deg, color-mix(in oklab, var(--a3) 60%, #050507) 0%, transparent 55%); opacity: .7; }
[data-dir="spatial"] .hero-copy.glass,
[data-dir="ambilight"] .hero-copy.glass { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
[data-dir="ambilight"] .hero-copy { position: absolute; left: 48px; bottom: 120px; width: min(560px, 55%); }
[data-dir="ambilight"] .hero h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(52px, 6.4vw, 96px); letter-spacing: -.035em; line-height: .9;
  text-shadow: 0 0 calc(var(--glow) * 60px) color-mix(in oklab, var(--a1) 60%, transparent); }
[data-dir="ambilight"] .eyebrow i { background: var(--a1); box-shadow: 0 0 10px var(--a1); }
[data-dir="ambilight"] .meta .chip { background: var(--a1); color: #0b0b0d; }
[data-dir="ambilight"] .btn.primary { background: var(--a1); color: #0b0b0d; box-shadow: 0 10px 40px -8px color-mix(in oklab, var(--a1) calc(var(--glow) * 100%), transparent); }
[data-dir="ambilight"] .btn.ghost { background: rgb(255 255 255 / .1); }

[data-dir="ambilight"] .card { border-radius: 10px; }
[data-dir="ambilight"] .card:hover { transform: translateY(-4px) scale(1.04);
  box-shadow: 0 0 0 1px color-mix(in oklab, var(--c) 60%, transparent), 0 18px 60px -6px color-mix(in oklab, var(--c) calc(var(--glow) * 90%), transparent); }
[data-dir="ambilight"] .card .prog i { background: var(--c); }
[data-dir="ambilight"] #panel { right: 24px; top: 70px; }
[data-dir="ambilight"] .tog[aria-pressed="true"] i { background: var(--a1); }

/* =====================================================================
   4. SPATIAL
   ===================================================================== */
[data-dir="spatial"] #wall { background: radial-gradient(120% 90% at 50% 0%, #1a1d26, #08090c 70%); }
[data-dir="spatial"] .floor { position: absolute; left: -50%; right: -50%; bottom: -10%; height: 60%;
  background: linear-gradient(rgb(255 255 255 / .05) 1px, transparent 1px) 0 0 / 80px 80px, linear-gradient(90deg, rgb(255 255 255 / .05) 1px, transparent 1px) 0 0 / 80px 80px;
  transform: perspective(600px) rotateX(70deg); transform-origin: 50% 0; -webkit-mask: linear-gradient(transparent, #000 30%, transparent); mask: linear-gradient(transparent, #000 30%, transparent); }
[data-dir="spatial"] .glass {
  background: linear-gradient(160deg, rgb(255 255 255 / .12), rgb(255 255 255 / .04));
  -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .25), inset 0 0 0 1px rgb(255 255 255 / .08), 0 50px 100px -30px rgb(0 0 0 / .9);
}
[data-dir="spatial"] #main { --pad: 40px; padding: 26px 0 40px 140px; perspective: 1800px; }
[data-dir="spatial"] #spnav { display: flex; left: 22px; top: 50%; flex-direction: column; gap: 6px; padding: 10px; border-radius: 30px;
  transform: translateY(-50%) perspective(900px) rotateY(calc(var(--depth) * 14deg)); transform-origin: left center; }
#spnav .pi { position: relative; width: 52px; height: 52px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; background: transparent; opacity: .75; transition: transform .35s cubic-bezier(.16,1,.3,1), background .25s, opacity .25s; }
#spnav .pi svg { width: 22px; height: 22px; }
#spnav .pi:hover { transform: translateZ(30px) scale(1.08); background: rgb(255 255 255 / .1); opacity: 1; }
#spnav .pi.on { background: rgb(255 255 255 / .9); color: #0b0c10; opacity: 1; box-shadow: 0 10px 30px -10px rgb(255 255 255 / .5); }
#spnav .pi .tip { position: absolute; left: calc(100% + 14px); white-space: nowrap; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px;
  background: rgb(30 33 42 / .92); color: #fff; opacity: 0; transform: translateX(-6px); transition: .2s; pointer-events: none; }
#spnav .pi:hover .tip { opacity: 1; transform: none; }
[data-dir="spatial"] .hero { height: min(56vh, 540px); margin-right: 40px; border-radius: 34px; transform-style: preserve-3d;
  transform: rotateX(calc(var(--py) * -2deg * var(--depth))) rotateY(calc(var(--px) * 3deg * var(--depth))) translateZ(calc(var(--depth) * 20px));
  transition: transform .6s cubic-bezier(.16,1,.3,1);
  box-shadow: 0 60px 120px -40px rgb(0 0 0 / .95), inset 0 0 0 1px rgb(255 255 255 / .1); }
[data-dir="spatial"] .hero .L.mid { transform: translate3d(calc(var(--px) * -14px * var(--depth)), calc(var(--py) * -10px * var(--depth)), 0); transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .6s; }
[data-dir="spatial"] .hero .L.fg { transform: translate3d(calc(var(--px) * -30px * var(--depth)), calc(var(--py) * -16px * var(--depth)), 0) scale(1.04); transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .6s; }
[data-dir="spatial"] .hero .L.bg { transform: translate3d(calc(var(--px) * 6px * var(--depth)), 0, 0); transition: transform .5s; }
[data-dir="spatial"] .hero-fade { background: linear-gradient(90deg, rgb(6 7 10 / .82), transparent 60%), linear-gradient(0deg, rgb(6 7 10 / .6), transparent 45%); }
[data-dir="spatial"] .hero-copy { position: absolute; left: 44px; bottom: 40px; width: min(480px, 55%); transform: translateZ(calc(var(--depth) * 40px)); }
[data-dir="spatial"] .hero h1 { font-family: "Sora", sans-serif; font-weight: 600; font-size: clamp(40px, 4.6vw, 66px); letter-spacing: -.04em; }
[data-dir="spatial"] .meta .chip { background: rgb(255 255 255 / .16); }
[data-dir="spatial"] .btn { border-radius: 999px; }
[data-dir="spatial"] .btn.primary { background: #fff; color: #0b0c10; box-shadow: 0 14px 30px -10px rgb(255 255 255 / .35); }
[data-dir="spatial"] .btn.ghost { background: rgb(255 255 255 / .14); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgb(255 255 255 / .25); }
[data-dir="spatial"] .dots { right: 34px; bottom: 34px; }
[data-dir="spatial"] .rows { transform-style: preserve-3d; }
[data-dir="spatial"] .row { transform-origin: 50% 50%; }
[data-dir="spatial"][data-recede="on"] .rows:has(.row:hover) .row:not(:hover) { opacity: .42; transform: scale(.975) translateY(4px); }
[data-dir="spatial"] .card { border-radius: 20px; box-shadow: 0 24px 40px -22px rgb(0 0 0 / .9); }
[data-dir="spatial"] .card:hover { box-shadow: 0 50px 60px -26px rgb(0 0 0 / .95), 0 0 0 1px rgb(255 255 255 / .2); z-index: 2; }
[data-dir="spatial"] .card:hover .sheen { opacity: 1; }
[data-dir="spatial"][data-light="on"] #light { display: block;
  background: radial-gradient(420px circle at var(--cx) var(--cy), rgb(255 255 255 / .09), transparent 70%); mix-blend-mode: plus-lighter; }
[data-dir="spatial"] #panel { right: 22px; top: 22px; transform: perspective(900px) rotateY(calc(var(--depth) * -8deg)); transform-origin: right center; }
[data-dir="spatial"][data-panel="closed"] #panel { transform: perspective(900px) rotateY(-20deg) translateX(30px); }
[data-dir="spatial"] #wall .blob, [data-dir="spatial"] #wall .rays, [data-dir="spatial"] #wall .wash,
[data-dir="deepwater"] #wall .wash, [data-dir="deepwater"] #wall .floor,
[data-dir="ambilight"] #wall .blob, [data-dir="ambilight"] #wall .rays, [data-dir="ambilight"] #wall .floor { display: none; }

/* =====================================================================
   1+4. FATHOM: Deepwater glass with Spatial depth
   (data-dir="deepwater" + data-fx="spatial")
   ===================================================================== */
[data-fx="spatial"] #wall { transform: translate3d(calc(var(--px) * -12px * var(--depth)), calc(var(--py) * -8px * var(--depth)), 0) scale(1.04); transition: transform .8s cubic-bezier(.16,1,.3,1); }
[data-fx="spatial"] #main { perspective: 1800px; }
[data-fx="spatial"] .hero {
  transform: rotateX(calc(var(--py) * -2deg * var(--depth))) rotateY(calc(var(--px) * 3deg * var(--depth)));
  transition: transform .6s cubic-bezier(.16,1,.3,1); }
[data-fx="spatial"] .hero .L.bg { transform: translate3d(calc(var(--px) * 6px * var(--depth)), 0, 0); transition: transform .5s; }
[data-fx="spatial"] .hero .L.mid { transform: translate3d(calc(var(--px) * -14px * var(--depth)), calc(var(--py) * -10px * var(--depth)), 0); transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .6s; }
[data-fx="spatial"] .hero .L.fg { transform: translate3d(calc(var(--px) * -30px * var(--depth)), calc(var(--py) * -16px * var(--depth)), 0) scale(1.04); transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .6s; }
[data-fx="spatial"] .hero-copy { transform: translate3d(calc(var(--px) * 8px * var(--depth)), calc(var(--py) * 6px * var(--depth)), 0); transition: transform .6s cubic-bezier(.16,1,.3,1); }
[data-fx="spatial"] #dock { transform: translateX(-50%) perspective(700px) rotateX(calc(var(--depth) * 16deg)); transform-origin: 50% 100%; }
[data-fx="spatial"] #sidebar { transform: perspective(900px) rotateY(calc(var(--depth) * 9deg)); transform-origin: left center; }
[data-fx="spatial"] #island { transform: translateX(-50%) perspective(800px) rotateX(calc(var(--depth) * -10deg)); transform-origin: 50% 0; }
[data-fx="spatial"] #panel { transform: perspective(900px) rotateY(calc(var(--depth) * -7deg)); transform-origin: right center; }
[data-fx="spatial"][data-panel="closed"] #panel { transform: perspective(900px) rotateY(-20deg) translateX(30px); }
[data-fx="spatial"][data-recede="on"] .rows:has(.row:hover) .row:not(:hover) { opacity: .45; transform: scale(.975) translateY(4px); }
[data-fx="spatial"] .card:hover .sheen { opacity: 1; }
[data-fx="spatial"] .card:hover { z-index: 2; }
[data-fx="spatial"][data-light="on"] #light { display: block;
  background: radial-gradient(460px circle at var(--cx) var(--cy), color-mix(in oklab, var(--accent) 14%, transparent), transparent 70%); mix-blend-mode: plus-lighter; }

@media (prefers-reduced-motion: reduce) {
  .blob, .rays { animation: none !important; }
  #app { transition: none; }
}
@media (max-width: 760px) {
  #switcher .note, #switcher .label { display: none; }
  #panel { width: calc(100% - 32px); right: 16px !important; }
  [data-dir="deepwater"] .hero, [data-dir="spatial"] .hero { margin: 0 16px; }
  [data-dir="spatial"] #main { padding-left: 16px; }
  [data-dir="spatial"] #spnav { display: none; }
  .hero-copy { width: calc(100% - 32px) !important; left: 16px !important; }
}
</style>
</head>
<body>

<nav id="switcher" aria-label="Concept switcher">
  <span class="label">Harbor theme concepts</span>
  <button data-dir="deepwater" aria-pressed="true"><span class="num">1</span>Deepwater Glass</button>
  <button data-dir="ambilight" aria-pressed="false"><span class="num">2</span>Ambilight</button>
  <button data-dir="spatial" aria-pressed="false"><span class="num">4</span>Spatial</button>
  <button data-dir="fusion" aria-pressed="false"><span class="num">1+4</span>Fathom</button>
  <span class="spacer"></span>
  <span class="note">Mockup. Poster art is generated placeholder.</span>
  <button id="panelToggle" aria-pressed="true">Settings panel</button>
</nav>

<div id="app" data-dir="deepwater" data-fx="off" data-chrome="dock" data-caustics="on" data-magnify="on" data-perf="full" data-arttint="off"
     data-follow="on" data-cycle="off" data-light="on" data-recede="on" data-panel="open">
  <div id="wall">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="rays"></div>
    <div class="wash"></div>
    <div class="floor"></div>
    <div class="grain"></div>
  </div>

  <!-- Deepwater chrome -->
  <header id="menubar" class="chrome glass"></header>
  <nav id="dock" class="chrome glass" aria-label="Dock"></nav>
  <nav id="sidebar" class="chrome glass" aria-label="Sidebar"></nav>
  <nav id="island" class="chrome glass" aria-label="Island"></nav>
  <!-- Ambilight chrome -->
  <nav id="ambnav" class="chrome" aria-label="Main"></nav>
  <!-- Spatial chrome -->
  <nav id="spnav" class="chrome glass" aria-label="Main"></nav>

  <main id="main">
    <section class="hero" id="hero">
      <div class="hero-art"><div class="L bg"></div><div class="L mid"></div><div class="L fg"></div></div>
      <div class="hero-fade"></div>
      <div class="hero-copy glass">
        <div class="eyebrow"><i></i><span id="heroEyebrow">#1 in Harbor today</span></div>
        <h1 id="heroTitle"></h1>
        <div class="meta" id="heroMeta"></div>
        <p class="desc" id="heroDesc"></p>
        <div class="actions">
          <button class="btn primary"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>Play</button>
          <button class="btn ghost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Watchlist</button>
        </div>
      </div>
      <div class="dots" id="dots"></div>
    </section>
    <div class="rows" id="rows"></div>
  </main>

  <div id="light"></div>

  <aside id="panel" class="glass" aria-label="Theme settings">
    <div class="ph">
      <div><b id="panelTitle">Deepwater</b><small>Theme settings. Changes apply live.</small></div>
      <button class="x" id="panelClose" aria-label="Close settings">✕</button>
    </div>

    <h3>Presets</h3>
    <div class="presets" id="presets"></div>

    <!-- Deepwater -->
    <div data-for="deepwater">
      <h3>Navigation</h3>
      <div class="seg" data-attr="chrome">
        <button data-v="dock">Dock</button><button data-v="sidebar">Sidebar</button><button data-v="island">Island</button>
      </div>
      <button class="tog" data-attr="magnify"><span>Dock magnification</span><i></i></button>
      <h3>Glass</h3>
      <label class="ctl"><span>Blur</span><output></output><input type="range" min="0" max="48" step="1" data-var="--blur" data-unit="px"></label>
      <label class="ctl"><span>Rim light</span><output></output><input type="range" min="0" max="0.8" step="0.01" data-var="--rim"></label>
      <label class="ctl"><span>Frost</span><output></output><input type="range" min="0" max="0.2" step="0.005" data-var="--tint"></label>
      <button class="tog" data-attr="arttint"><span>Tint glass from artwork<small>Picks up the hero's colors</small></span><i></i></button>
      <button class="tog" data-attr="caustics"><span>Moving light under glass</span><i></i></button>
      <h3>Accent</h3>
      <div class="sw" data-var="--accent">
        <button style="--c:#7cc4ff" data-v="#7cc4ff" aria-label="Sky"></button>
        <button style="--c:#a5b4fc" data-v="#a5b4fc" aria-label="Periwinkle"></button>
        <button style="--c:#5eead4" data-v="#5eead4" aria-label="Teal"></button>
        <button style="--c:#fbbf77" data-v="#fbbf77" aria-label="Amber"></button>
        <button style="--c:#f9a8d4" data-v="#f9a8d4" aria-label="Rose"></button>
        <button style="--c:#e5e7eb" data-v="#e5e7eb" aria-label="Silver"></button>
      </div>
      <h3>Performance</h3>
      <div class="seg" data-attr="perf">
        <button data-v="full">Full</button><button data-v="balanced">Balanced</button><button data-v="lite">Lite</button>
      </div>
      <div class="fps" id="fps">Measuring frame rate…</div>
    </div>

    <!-- Ambilight -->
    <div data-for="ambilight">
      <h3>Ambient color</h3>
      <button class="tog" data-attr="follow"><span>Follow the artwork<small>UI color comes from what you're viewing</small></span><i></i></button>
      <label class="ctl"><span>Glow</span><output></output><input type="range" min="0" max="1" step="0.01" data-var="--glow"></label>
      <label class="ctl"><span>Spill</span><output></output><input type="range" min="0" max="1.6" step="0.01" data-var="--spill"></label>
      <label class="ctl"><span>Color fade</span><output></output><input type="range" min="0" max="3000" step="50" data-var="--amb-speed" data-unit="ms"></label>
      <h3>Fixed color (when not following)</h3>
      <div class="sw" data-var="--fixed">
        <button style="--c:#ff7a59" data-v="#ff7a59" aria-label="Coral"></button>
        <button style="--c:#ffd166" data-v="#ffd166" aria-label="Gold"></button>
        <button style="--c:#06d6a0" data-v="#06d6a0" aria-label="Mint"></button>
        <button style="--c:#4cc9f0" data-v="#4cc9f0" aria-label="Cyan"></button>
        <button style="--c:#b388ff" data-v="#b388ff" aria-label="Lilac"></button>
      </div>
      <h3>Hero</h3>
      <button class="tog" data-attr="cycle"><span>Auto-rotate featured titles</span><i></i></button>
    </div>

    <!-- Spatial -->
    <div data-for="spatial">
      <h3>Depth</h3>
      <label class="ctl"><span>Depth</span><output></output><input type="range" min="0" max="2" step="0.05" data-var="--depth"></label>
      <label class="ctl"><span>Poster tilt</span><output></output><input type="range" min="0" max="22" step="1" data-var="--tilt" data-unit="°"></label>
      <button class="tog" data-attr="light"><span>Cursor light<small>A soft light follows your pointer</small></span><i></i></button>
      <button class="tog" data-attr="recede"><span>Focus the row you're in<small>Other rows step back</small></span><i></i></button>
    </div>

    <h3>Posters</h3>
    <label class="ctl"><span>Size</span><output></output><input type="range" min="110" max="210" step="1" data-var="--pw" data-unit="px"></label>
  </aside>
</div>

<script>
(() => {
  const app = document.getElementById("app");

  /* ---------- placeholder catalogue ---------- */
  const T = [
    { t: "Low Tide", y: 2025, g: "Mystery", rt: "2h 4m", r: "8.1", pal: ["#0b2a3c", "#1f6f8b", "#f2b880", "#04121b"], mid: "sun", fg: "waves", d: "A harbor town goes quiet the night the sea pulls back further than anyone remembers, and something is left on the sand." },
    { t: "Neon Orchard", y: 2024, g: "Sci-fi", rt: "1h 52m", r: "7.6", pal: ["#1a0b2e", "#5b1f6b", "#ff5fa2", "#0c0614"], mid: "orb", fg: "city", d: "In a city that grows its own light, a night gardener finds a tree that should not exist." },
    { t: "The Salt Line", y: 2023, g: "Drama", rt: "2h 11m", r: "8.4", pal: ["#2b1d14", "#a0603a", "#ffd29a", "#140c07"], mid: "sun", fg: "dunes", d: "Two sisters run the last salt works on a coast that wants it gone." },
    { t: "Halcyon", y: 2026, g: "Series", rt: "2 seasons", r: "8.7", pal: ["#06232a", "#2d8c7f", "#c8fff0", "#021013"], mid: "rings", fg: "peaks", d: "A research station in the fjords picks up a signal that answers back." },
    { t: "Iron Meridian", y: 2025, g: "Thriller", rt: "1h 58m", r: "7.2", pal: ["#111317", "#3a4250", "#ff6a3d", "#07080a"], mid: "monolith", fg: "city", d: "A rail engineer has one night to stop a train that isn't on any map." },
    { t: "Paper Moons", y: 2024, g: "Animation", rt: "1h 34m", r: "8.9", pal: ["#1b1840", "#4b4aa8", "#ffe08a", "#0d0b24"], mid: "moon", fg: "peaks", d: "A girl folds a moon out of paper, and the sky decides to keep it." },
    { t: "Northbound", y: 2022, g: "Adventure", rt: "2h 20m", r: "7.9", pal: ["#0d1b2a", "#415a77", "#e0e1dd", "#060d15"], mid: "moon", fg: "peaks", d: "Three strangers, one truck, and four thousand miles of winter road." },
    { t: "Glasshouse", y: 2026, g: "Horror", rt: "1h 41m", r: "6.8", pal: ["#0f1f14", "#2f5d3a", "#b6ff8a", "#06100a"], mid: "orb", fg: "dunes", d: "The greenhouse at the end of the lane glows every night. Nobody planted anything." },
    { t: "Ember County", y: 2023, g: "Western", rt: "2h 6m", r: "7.4", pal: ["#2a0f0a", "#8a2c12", "#ffb347", "#120503"], mid: "sun", fg: "dunes", d: "A drought, a debt, and a sheriff who stopped believing in either." },
    { t: "The Quiet Signal", y: 2025, g: "Sci-fi", rt: "1h 49m", r: "8.0", pal: ["#071426", "#0f3f73", "#6fd3ff", "#030a14"], mid: "rings", fg: "city", d: "Every radio on Earth goes silent for eleven seconds. Then they start counting down." },
    { t: "Vesper", y: 2024, g: "Romance", rt: "1h 47m", r: "7.7", pal: ["#26101f", "#7a2e57", "#ffc2d6", "#12070f"], mid: "moon", fg: "waves", d: "Two night-ferry workers cross paths for one summer of evenings." },
    { t: "Driftwood Kings", y: 2022, g: "Comedy", rt: "1h 39m", r: "7.1", pal: ["#10222a", "#3f7f8c", "#ffd56b", "#081217"], mid: "sun", fg: "waves", d: "Four retirees enter a raft race they have absolutely no chance of winning." },
  ];

  /* ---------- generated art (stand-in for real posters) ---------- */
  let uid = 0;
  const rng = (seed) => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const svg = (W, H, inner) => `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

  function bgLayer(p, W, H) {
    const [a, b, c] = p.pal, id = "g" + uid++, r = rng(p.t.length * 97 + W);
    let stars = "";
    if (p.mid === "moon" || p.mid === "rings") for (let i = 0; i < 50; i++)
      stars += `<circle cx="${r() * W}" cy="${r() * H * .6}" r="${(r() * 1.2 + .3) * W / 600}" fill="#fff" opacity="${(r() * .6 + .2).toFixed(2)}"/>`;
    return svg(W, H, `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
      <radialGradient id="${id}h" cx=".64" cy=".45" r=".55"><stop offset="0" stop-color="${c}" stop-opacity=".45"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#${id})"/><rect width="${W}" height="${H}" fill="url(#${id}h)"/>${stars}`);
  }
  function midLayer(p, W, H) {
    const [a, b, c] = p.pal, m = Math.min(W, H), id = "m" + uid++;
    const cx = W * .64, cy = H * .48;
    let s = "";
    if (p.mid === "sun") {
      const R = m * .26;
      s += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs>
        <clipPath id="${id}c"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>
        <circle cx="${cx}" cy="${cy}" r="${R * 1.7}" fill="${c}" opacity=".12"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#${id})"/><g clip-path="url(#${id}c)">`;
      for (let k = 0; k < 6; k++) s += `<rect x="${cx - R * 1.1}" y="${cy + R * (.12 + k * .16)}" width="${R * 2.2}" height="${R * (.025 + k * .022)}" fill="${b}"/>`;
      s += `</g>`;
    } else if (p.mid === "moon") {
      const R = m * .17, mx = W * .68, my = H * .34;
      s += `<circle cx="${mx}" cy="${my}" r="${R * 2.4}" fill="${c}" opacity=".08"/><circle cx="${mx}" cy="${my}" r="${R}" fill="${c}"/><circle cx="${mx + R * .42}" cy="${my - R * .22}" r="${R * .92}" fill="${a}"/>`;
    } else if (p.mid === "rings") {
      for (let k = 1; k <= 7; k++) s += `<circle cx="${cx}" cy="${cy}" r="${m * .05 * k * k * .5 + m * .04}" fill="none" stroke="${c}" stroke-width="${m * .006}" opacity="${(1 - k / 8).toFixed(2)}"/>`;
      s += `<circle cx="${cx}" cy="${cy}" r="${m * .035}" fill="${c}"/>`;
    } else if (p.mid === "orb") {
      s += `<defs><radialGradient id="${id}"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs>
        <circle cx="${cx}" cy="${cy}" r="${m * .42}" fill="url(#${id})" opacity=".85"/>`;
    } else if (p.mid === "monolith") {
      s += `<defs><radialGradient id="${id}"><stop offset="0" stop-color="${c}" stop-opacity=".7"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs>
        <ellipse cx="${cx}" cy="${H * .5}" rx="${m * .4}" ry="${m * .5}" fill="url(#${id})"/>
        <rect x="${cx - m * .055}" y="${H * .18}" width="${m * .11}" height="${H * .62}" fill="${p.pal[3]}" stroke="${c}" stroke-width="${m * .006}"/>`;
    }
    return svg(W, H, s);
  }
  function fgLayer(p, W, H) {
    const d = p.pal[3], c = p.pal[2], r = rng(p.t.charCodeAt(0) * 31 + W);
    let s = "";
    const ridge = (lo, hi, n, op) => {
      let path = `M0 ${H}`;
      for (let i = 0; i <= n; i++) path += ` L${(i / n) * W} ${H * (lo + r() * (hi - lo))}`;
      return `<path d="${path} L${W} ${H} Z" fill="${d}" opacity="${op}"/>`;
    };
    if (p.fg === "peaks") s = ridge(.52, .74, 9, .55) + ridge(.66, .86, 7, 1);
    else if (p.fg === "city") {
      let x = 0; s += ridge(.78, .84, 4, .6);
      while (x < W) {
        const w = W * (.035 + r() * .06), h = H * (.12 + r() * .3);
        s += `<rect x="${x}" y="${H - h}" width="${w}" height="${h}" fill="${d}"/>`;
        for (let k = 0; k < 4; k++) if (r() > .45) s += `<rect x="${x + w * (.2 + r() * .5)}" y="${H - h + h * (.1 + r() * .7)}" width="${w * .12}" height="${w * .12}" fill="${c}" opacity=".7"/>`;
        x += w + W * .004;
      }
    } else if (p.fg === "waves") {
      [[.72, .55], [.8, .8], [.88, 1]].forEach(([y, op], j) => {
        let path = `M0 ${H * y}`;
        for (let i = 0; i <= 12; i++) path += ` Q${(i + .5) / 12 * W} ${H * (y - .025 + j * .004)} ${(i + 1) / 12 * W} ${H * y}`;
        s += `<path d="${path} L${W} ${H} L0 ${H} Z" fill="${d}" opacity="${op}"/>`;
      });
    } else if (p.fg === "dunes") {
      s += `<path d="M0 ${H * .74} Q${W * .3} ${H * .6} ${W * .6} ${H * .76} T${W} ${H * .7} L${W} ${H} L0 ${H}Z" fill="${d}" opacity=".6"/>`;
      s += `<path d="M0 ${H * .86} Q${W * .4} ${H * .72} ${W} ${H * .88} L${W} ${H} L0 ${H}Z" fill="${d}"/>`;
    }
    return svg(W, H, s);
  }
  const fullArt = (p, W, H) => [bgLayer(p, W, H), midLayer(p, W, H), fgLayer(p, W, H)].map((x) => `<div style="position:absolute;inset:0">${x}</div>`).join("");

  /* ---------- icons ---------- */
  const I = {
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
    discover: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
    movies: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
    shows: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/>',
    anime: '<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>',
    live: '<circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    library: '<path d="M5 4v16M10 4v16M15 5l4 15"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    tune: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
    mark: '<path d="M4 14c2.5 2 5.5 3 8 3s5.5-1 8-3M12 3v14M8 7h8"/><circle cx="12" cy="4" r="1"/>',
  };
  const ic = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
  const NAV = [["home", "Home"], ["discover", "Discover"], ["movies", "Movies"], ["shows", "Shows"], ["anime", "Anime"], ["live", "Live TV"], ["calendar", "Calendar"], ["library", "My Library"]];
  let current = "home";

  function renderChrome() {
    const on = (k) => (k === current ? " on" : "");
    document.getElementById("menubar").innerHTML =
      `<span class="logo">${ic("mark")}Harbor</span>` +
      NAV.slice(0, 6).map(([k, l]) => `<a data-nav="${k}" class="${on(k).trim()}">${l}</a>`).join("") +
      `<span class="right">${ic("search")}<span class="clock"></span></span>`;
    document.getElementById("dock").innerHTML =
      NAV.map(([k, l]) => `<button class="di${on(k)}" data-nav="${k}" aria-label="${l}">${ic(k)}<span class="tip">${l}</span></button>`).join("") +
      `<span class="sep"></span><button class="di" data-nav="search" aria-label="Search">${ic("search")}<span class="tip">Search</span></button>` +
      `<button class="di" data-open-panel aria-label="Customize">${ic("tune")}<span class="tip">Customize</span></button>`;
    document.getElementById("sidebar").innerHTML =
      `<div class="cap">Browse</div>` + NAV.map(([k, l]) => `<button class="si${on(k)}" data-nav="${k}">${ic(k)}${l}</button>`).join("") +
      `<div class="grow"></div><button class="si" data-open-panel>${ic("tune")}Customize</button>`;
    document.getElementById("island").innerHTML =
      NAV.slice(0, 6).map(([k, l]) => `<button class="ii${on(k)}" data-nav="${k}">${k === current ? ic(k) : ""}${l}</button>`).join("") +
      `<button class="ii" data-open-panel aria-label="Customize">${ic("tune")}</button><span class="clock"></span>`;
    document.getElementById("ambnav").innerHTML =
      `<span class="brand">${ic("mark")}Harbor</span><div class="pill glass">` +
      NAV.slice(0, 6).map(([k, l]) => `<button class="ai${on(k)}" data-nav="${k}">${l}</button>`).join("") +
      `</div><div class="right"><span class="lit glass"><i></i><span id="litName"></span></span><button class="ib glass" aria-label="Search">${ic("search")}</button><button class="ib glass" data-open-panel aria-label="Customize">${ic("tune")}</button></div>`;
    document.getElementById("spnav").innerHTML =
      NAV.map(([k, l]) => `<button class="pi${on(k)}" data-nav="${k}" aria-label="${l}">${ic(k)}<span class="tip">${l}</span></button>`).join("") +
      `<button class="pi" data-open-panel aria-label="Customize">${ic("tune")}<span class="tip">Customize</span></button>`;
    tick();
    const lit = document.getElementById("litName"); if (lit) lit.textContent = "Lit by " + T[featured].t;
  }

  /* ---------- hero + rows ---------- */
  let featured = 0;
  const heroIdx = [0, 3, 5, 9, 1];
  function setFeatured(i) {
    featured = i; const p = T[i];
    const layers = document.querySelectorAll("#hero .L");
    [bgLayer(p, 1600, 900), midLayer(p, 1600, 900), fgLayer(p, 1600, 900)].forEach((html, k) => (layers[k].innerHTML = html));
    document.getElementById("heroTitle").textContent = p.t;
    document.getElementById("heroMeta").innerHTML = `<span>${p.y}</span><span>${p.g}</span><span>${p.rt}</span><span class="chip">★ ${p.r}</span>`;
    document.getElementById("heroDesc").textContent = p.d;
    app.style.setProperty("--amb1", p.pal[2]);
    app.style.setProperty("--amb2", p.pal[1]);
    app.style.setProperty("--amb3", p.pal[0]);
    const lit = document.getElementById("litName"); if (lit) lit.textContent = "Lit by " + p.t;
    document.querySelectorAll("#dots button").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.i === i)));
  }
  document.getElementById("dots").innerHTML = heroIdx.map((i) => `<button data-i="${i}" aria-label="Show ${T[i].t}"></button>`).join("");

  const card = (p, i, kind, prog) =>
    `<div class="card ${kind}" data-i="${i}" style="--c:${p.pal[2]}"><div class="art">${fullArt(p, kind === "wide" ? 320 : 200, kind === "wide" ? 180 : 300)}</div>
      <div class="cap"><b>${p.t}</b><span>${kind === "wide" ? "S1 · E" + (i % 7 + 2) + " · 23 min left" : p.y + " · " + p.g}</span></div>
      ${prog ? `<div class="prog"><i style="width:${prog}%"></i></div>` : ""}<div class="sheen"></div></div>`;
  const order = (arr) => arr.map((i) => [T[i], i]);
  document.getElementById("rows").innerHTML = [
    ["Continue watching", order([3, 10, 6, 1, 8]), "wide"],
    ["Trending this week", order([1, 2, 4, 5, 7, 8, 9, 11, 6, 0]), "poster"],
    ["Because you watched Low Tide", order([11, 10, 3, 6, 2, 9, 5, 4]), "poster"],
    ["Award winners", order([5, 2, 0, 3, 7, 1, 10, 8]), "poster"],
  ].map(([h, items, kind]) =>
    `<section class="row"><header><h2>${h}</h2><a>See all</a></header><div class="track">${items.map(([p, i], n) => card(p, i, kind, kind === "wide" ? 20 + ((n * 37) % 70) : 0)).join("")}</div></section>`
  ).join("");

  /* ---------- clock ---------- */
  function tick() {
    const now = new Date();
    const s = now.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) + "  " + now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    document.querySelectorAll(".clock").forEach((c) => (c.textContent = s));
  }
  setInterval(tick, 15000);

  /* ---------- settings state ---------- */
  const DEFAULT_VARS = { "--blur": "24px", "--rim": "0.35", "--tint": "0.06", "--accent": "#7cc4ff", "--glow": "0.75", "--spill": "1", "--amb-speed": "1200ms", "--fixed": "#ff7a59", "--depth": "1", "--tilt": "10°", "--pw": "150px" };
  const vars = { ...DEFAULT_VARS };
  function setVar(name, val) {
    vars[name] = val;
    app.style.setProperty(name, name === "--tilt" ? String(parseFloat(val)) : val);
  }
  function setAttr(name, val) { app.dataset[name] = val; }
  function sync() {
    document.querySelectorAll("#panel input[type=range]").forEach((inp) => {
      const v = parseFloat(vars[inp.dataset.var]); inp.value = v;
      inp.closest(".ctl").querySelector("output").textContent = (Number.isInteger(v) ? v : v.toFixed(2)) + (inp.dataset.unit || "");
    });
    document.querySelectorAll("#panel .tog").forEach((b) => b.setAttribute("aria-pressed", String(app.dataset[b.dataset.attr] === "on")));
    document.querySelectorAll("#panel .seg").forEach((s) => s.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(app.dataset[s.dataset.attr] === b.dataset.v))));
    document.querySelectorAll("#panel .sw").forEach((s) => s.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(vars[s.dataset.var] === b.dataset.v))));
    document.getElementById("panelToggle").setAttribute("aria-pressed", String(app.dataset.panel === "open"));
  }
  Object.entries(vars).forEach(([k, v]) => setVar(k, v));

  const PRESETS = {
    deepwater: { Abyss: { "--blur": "24px", "--rim": "0.35", "--tint": "0.06", "--accent": "#7cc4ff" }, Clear: { "--blur": "10px", "--rim": "0.6", "--tint": "0.02", "--accent": "#e5e7eb" }, Frost: { "--blur": "44px", "--rim": "0.22", "--tint": "0.15", "--accent": "#a5b4fc" } },
    ambilight: { Cinema: { "--glow": "0.75", "--spill": "1" }, Subtle: { "--glow": "0.3", "--spill": "0.45" }, Vivid: { "--glow": "1", "--spill": "1.6" } },
    spatial: { Float: { "--depth": "1", "--tilt": "10°" }, Deep: { "--depth": "1.8", "--tilt": "18°" }, Calm: { "--depth": "0.35", "--tilt": "4°" } },
    fusion: {
      Trench: { "--blur": "28px", "--rim": "0.4", "--tint": "0.06", "--accent": "#7cc4ff", "--depth": "1.2", "--tilt": "12°" },
      Shallows: { "--blur": "12px", "--rim": "0.55", "--tint": "0.03", "--accent": "#5eead4", "--depth": "0.6", "--tilt": "6°" },
      "Still water": { "--blur": "24px", "--rim": "0.3", "--tint": "0.08", "--accent": "#e5e7eb", "--depth": "0.2", "--tilt": "0°" },
    },
  };
  const TITLES = { deepwater: "Deepwater", ambilight: "Ambilight", spatial: "Spatial", fusion: "Fathom" };
  let concept = "deepwater";
  function renderPresets() {
    const set = PRESETS[concept];
    document.getElementById("presets").innerHTML = Object.keys(set).map((n) => `<button data-preset="${n}">${n}</button>`).join("");
    document.getElementById("panelTitle").textContent = TITLES[concept];
  }
  const depthOn = () => app.dataset.dir === "spatial" || app.dataset.fx === "spatial";

  /* ---------- events ---------- */
  document.getElementById("panel").addEventListener("input", (e) => {
    const inp = e.target; if (!inp.dataset.var) return;
    setVar(inp.dataset.var, inp.value + (inp.dataset.unit || "")); sync();
  });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a, .card");
    if (!t) return;
    if (t.matches("#switcher [data-dir]")) {
      concept = t.dataset.dir;
      app.dataset.dir = concept === "fusion" ? "deepwater" : concept;
      app.dataset.fx = concept === "fusion" ? "spatial" : "off";
      if (!depthOn()) { app.style.setProperty("--px", 0); app.style.setProperty("--py", 0); }
      document.querySelectorAll("#switcher [data-dir]").forEach((b) => b.setAttribute("aria-pressed", String(b === t)));
      renderPresets(); sync(); resetMagnify(); return;
    }
    if (t.id === "panelToggle") { setAttr("panel", app.dataset.panel === "open" ? "closed" : "open"); sync(); return; }
    if (t.id === "panelClose") { setAttr("panel", "closed"); sync(); return; }
    if (t.matches("[data-open-panel]")) { setAttr("panel", app.dataset.panel === "open" ? "closed" : "open"); sync(); return; }
    if (t.matches(".tog")) { setAttr(t.dataset.attr, app.dataset[t.dataset.attr] === "on" ? "off" : "on"); sync(); if (t.dataset.attr === "magnify") resetMagnify(); return; }
    if (t.closest(".seg")) { setAttr(t.closest(".seg").dataset.attr, t.dataset.v); sync(); return; }
    if (t.closest(".sw")) { setVar(t.closest(".sw").dataset.var, t.dataset.v); sync(); return; }
    if (t.dataset.preset) { Object.entries(PRESETS[concept][t.dataset.preset]).forEach(([k, v]) => setVar(k, v)); sync(); return; }
    if (t.dataset.nav && t.dataset.nav !== "search") { current = t.dataset.nav; renderChrome(); return; }
    if (t.matches("#dots button")) { setFeatured(+t.dataset.i); return; }
    if (t.matches(".card")) { setFeatured(+t.dataset.i); document.getElementById("main").scrollTo({ top: 0, behavior: "smooth" }); }
  });

  /* dock magnification (Deepwater) */
  const dock = document.getElementById("dock");
  function resetMagnify() { dock.querySelectorAll(".di").forEach((d) => d.style.setProperty("--s", 1)); }
  dock.addEventListener("pointermove", (e) => {
    if (app.dataset.magnify !== "on") return;
    dock.querySelectorAll(".di").forEach((d) => {
      const r = d.getBoundingClientRect(), dist = Math.abs(e.clientX - (r.left + r.width / 2));
      d.style.setProperty("--s", (1 + 0.55 * Math.max(0, 1 - dist / 130)).toFixed(3));
    });
  });
  dock.addEventListener("pointerleave", resetMagnify);

  /* pointer: parallax, cursor light, card tilt (Spatial only) */
  let raf = 0, last = null;
  app.addEventListener("pointermove", (e) => {
    if (!depthOn()) return;
    last = e;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const r = app.getBoundingClientRect();
      app.style.setProperty("--px", ((last.clientX - r.left) / r.width * 2 - 1).toFixed(3));
      app.style.setProperty("--py", ((last.clientY - r.top) / r.height * 2 - 1).toFixed(3));
      app.style.setProperty("--cx", last.clientX - r.left + "px");
      app.style.setProperty("--cy", last.clientY - r.top + "px");
      const c = last.target.closest && last.target.closest(".card");
      if (c) {
        const cr = c.getBoundingClientRect(), x = (last.clientX - cr.left) / cr.width, y = (last.clientY - cr.top) / cr.height;
        const tilt = parseFloat(vars["--tilt"]);
        c.style.transform = `perspective(700px) rotateX(${((0.5 - y) * tilt).toFixed(2)}deg) rotateY(${((x - 0.5) * tilt).toFixed(2)}deg) translateZ(${18 * parseFloat(vars["--depth"])}px) scale(1.05)`;
        c.style.setProperty("--mx", x * 100 + "%"); c.style.setProperty("--my", y * 100 + "%");
      }
    });
  });
  document.getElementById("rows").addEventListener("pointerout", (e) => {
    const c = e.target.closest(".card");
    if (c && !c.contains(e.relatedTarget)) c.style.transform = "";
  });

  /* ambilight auto-rotate */
  let rot = 0;
  setInterval(() => {
    if (app.dataset.dir !== "ambilight" || app.dataset.cycle !== "on" || document.hidden) return;
    rot = (heroIdx.indexOf(featured) + 1) % heroIdx.length; setFeatured(heroIdx[rot]);
  }, 6000);

  /* frame-rate meter (what Auto performance mode would use) */
  let frames = 0, t0 = performance.now();
  (function loop(t) {
    frames++;
    if (t - t0 > 1000) {
      const fps = Math.round((frames * 1000) / (t - t0)); frames = 0; t0 = t;
      const el = document.getElementById("fps");
      if (el) el.textContent = `${fps} fps right now. Auto mode would step down below 50.`;
    }
    requestAnimationFrame(loop);
  })(performance.now());

  renderChrome(); setFeatured(0); renderPresets(); sync();
})();
</script>
</body>
</html>
